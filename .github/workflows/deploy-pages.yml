name: Validar y publicar Pesito

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Auditar dependencias
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:sql
      - run: npm run test:release:guards
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Identificar versión de la PWA
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" dist/sw.js
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      # Equivalente al empaquetado oficial, sin una Action compuesta que use tags.
      - name: Empaquetar sitio para Pages
        run: |
          tar --dereference --hard-dereference --directory dist \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  webhook:
    name: Webhook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/whatsapp-webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: deno cache --config deno.ci.json --frozen index.ts queue_test.ts routing_test.ts
      - run: deno task --config deno.ci.json check
      - run: deno task --config deno.ci.json lint
      - run: deno task --config deno.ci.json test

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: inf03_queue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inf03_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --cpus 1
          --memory 512m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verificar concurrencia SQL en base descartable
        run: npm run test:concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: inf03_queue_test
          PGPASSWORD: synthetic-ci-only
          PESITO_TEST_PSQL: /usr/bin/psql

  rehearsal:
    name: Ensayo de release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Registrar candidato sin credenciales
        run: npm run release:manifest -- local
      - name: Instalar, probar y volver a una versión compatible en Supabase local
        run: npm run test:release
      - name: Publicar evidencia saneada
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ensayo-release
          path: .temp/release-rehearsal.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publicar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, webhook, postgres, rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
