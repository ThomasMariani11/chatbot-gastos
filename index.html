    <title>Pesito — Finanzas personales</title>
    <style>
      .pesito-splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #20b984; font-family: Manrope, system-ui, sans-serif; }
      .pesito-splash__pig { width: 132px; height: 132px; animation: pesito-splash-float 2.2s ease-in-out infinite; }
      .pesito-splash__coin { animation: pesito-splash-drop 1.8s ease-in infinite; }
      .pesito-splash__name { color: #fff; font-size: 24px; font-weight: 800; letter-spacing: .2px; }
      .pesito-splash__track { display: block; width: 120px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .3); overflow: hidden; }
      .pesito-splash__bar { display: block; width: 0; height: 100%; border-radius: 4px; background: #fff; animation: pesito-splash-fill 6s cubic-bezier(.2, .7, .3, 1) forwards; }
      .pesito-splash__label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes pesito-splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes pesito-splash-drop { 0% { transform: translateY(-34px); opacity: 0; } 20% { opacity: 1; } 60% { transform: translateY(24px); opacity: 1; } 68%, 100% { transform: translateY(32px); opacity: 0; } }
      @keyframes pesito-splash-fill { from { width: 0; } to { width: 92%; } }
      @media (prefers-reduced-motion: reduce) {
        .pesito-splash__pig, .pesito-splash__coin, .pesito-splash__bar { animation: none; }
        .pesito-splash__coin, .pesito-splash__track { display: none; }
        .pesito-splash__label { position: static; width: auto; height: auto; clip-path: none; color: #e6fbf2; font-size: 14px; font-weight: 600; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="pesito-splash" role="status"><svg class="pesito-splash__pig" viewBox="0 0 170 170" aria-hidden="true" focusable="false"><defs><clipPath id="pesito-splash-above"><rect width="170" height="54"/></clipPath></defs><ellipse cx="88" cy="148" rx="50" ry="6" fill="#0a5238" opacity=".25"/><path d="M106,52 C118,38 138,34 142,40 C144,54 136,68 126,72 Z" fill="#1b8d60"/><rect x="60" y="118" width="18" height="24" rx="7" fill="#1b8d60"/><rect x="100" y="118" width="18" height="24" rx="7" fill="#1b8d60"/><circle cx="88" cy="90" r="46" fill="#45c992"/><ellipse cx="44" cy="98" rx="15" ry="14" fill="#1b8d60"/><ellipse cx="39" cy="98" rx="2.6" ry="4.2" fill="#062f20"/><ellipse cx="49" cy="98" rx="2.6" ry="4.2" fill="#062f20"/><path d="M62,80 Q68,73 74,80" stroke="#0a5238" stroke-width="3.5" fill="none" stroke-linecap="round"/><g clip-path="url(#pesito-splash-above)"><g class="pesito-splash__coin"><circle cx="89" cy="24" r="14" fill="#ffcc45"/><circle cx="89" cy="24" r="9" fill="none" stroke="#c4860a" stroke-width="2"/></g></g><rect class="pesito-splash__slot" x="75" y="50" width="28" height="7" rx="3.5" fill="#0a5238"/></svg><span class="pesito-splash__name">Pesito</span><span class="pesito-splash__track"><span class="pesito-splash__bar"></span></span><span class="pesito-splash__label">Abriendo Pesito…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
